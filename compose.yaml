services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_password
      POSTGRES_DB: agent_relay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d agent_relay"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay_password@postgres:5432/agent_relay
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy